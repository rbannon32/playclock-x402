[project]
name = "playclock"
version = "0.1.0"
description = "x402 pay-per-analysis fantasy football intelligence API (Algorand + GCP + ADK)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    # ADK 2.x changed import paths vs 1.x (tech spec §11.3); cap the major so a
    # future `uv lock --upgrade` can't silently move wave-3 agent code to 3.x.
    "google-adk>=2.8,<3",
    "google-cloud-firestore>=2.19",
    "google-genai>=1.0",
    "x402-avm[avm,extensions,fastapi]>=2.0.2",
]

[project.optional-dependencies]
# Ingest-only deps: keep the api container slim, single lockfile (DESIGN_NOTES #6).
ingest = [
    "nflreadpy>=0.1",
    "polars>=1.0",
]
# The MCP server is a *client* of this API: it pays, it does not serve. Kept out
# of the api image, which never imports it.
mcp = [
    "mcp>=2.1,<3",
    "py-algorand-sdk>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "ingest", "playclock_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
